<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>課堂筆記轉 Word</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">瀏覽器內轉換 · 不上傳筆記</p>
        <h1>課堂筆記轉 Word</h1>
        <p class="intro">貼上 Markdown 筆記，轉成可下載的 Word 文件。</p>
      </header>

      <section class="panel" aria-labelledby="input-title">
        <h2 id="input-title">支援的格式</h2>
        <ul class="syntax-list">
          <li><code># 標題</code> 轉成 Word 標題 1</li>
          <li><code>## 標題</code> 轉成 Word 標題 2</li>
          <li><code>- 項目</code> 轉成 Word 項目符號列表</li>
          <li>其他非空白行保留為普通段落；空白行會忽略</li>
        </ul>
        <p class="hint">不支援的語法（例如 <code>###</code>、<code>**粗體**</code>、HTML 或縮排列項）會原樣保留為文字。</p>

        <form id="notes-form">
          <label for="notes">Markdown 筆記</label>
          <textarea id="notes" name="notes" spellcheck="false" placeholder="# 資料結構複習&#10;## 重點&#10;- 先寫定義&#10;再寫自己的例子。"></textarea>
          <div class="actions">
            <button class="button button-secondary" id="example" type="button">載入範例</button>
            <button class="button button-secondary" id="clear" type="button">清空</button>
            <button class="button button-primary" id="convert" type="submit">轉換並下載 Word</button>
          </div>
        </form>
        <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      </section>

      <footer>轉換在此瀏覽器內完成。筆記不會上傳、記錄或儲存。</footer>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
